<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nightwatch - Logowanie</title>
    <style>
        /* RESET */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* STYL OGÓLNY - TYPYGRAFIA I KOLORY DISCORD */
        body {
            background-color: #36393f;
            color: #ffffff;
            font-family: 'Whitney', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* KONTENER LOGOWANIA */
        .login-container {
            background-color: #1e1f22;
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border-radius: 5px;
            box-shadow: 0 2px 10px 0 rgba(0,0,0,0.2);
            text-align: center;
        }

        /* LOGO I TYTUŁ */
        .logo-area {
            margin-bottom: 24px;
        }

        .logo-area h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo-area p {
            color: #b9bbbe;
            font-size: 14px;
            margin-top: 8px;
        }

        /* FORMULARZ / PRZYCISK */
        .discord-btn {
            background-color: #5865F2;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .discord-btn:hover {
            background-color: #4752c4;
        }

        .discord-icon {
            width: 20px;
            height: 20px;
            fill: white;
        }

        /* SEKCJA WYNIKU (UKRYTA NA START) */
        .result-panel {
            display: none;
            margin-top: 20px;
            background-color: #2f3136;
            padding: 15px;
            border-radius: 5px;
            text-align: left;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            border: 1px solid #202225;
        }

        .result-panel h3 {
            font-size: 14px;
            color: #00b0f4;
            margin-bottom: 10px;
            border-bottom: 1px solid #40444b;
            padding-bottom: 5px;
        }

        .data-row {
            margin-bottom: 8px;
        }

        .label {
            color: #b9bbbe;
            font-weight: bold;
        }

        .value {
            color: #ffffff;
        }

        /* ANIMACJA ŁADOWANIA */
        .loader {
            display: none;
            margin: 10px auto;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #5865F2;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-area">
            <h1>NIGHTWATCH</h1>
            <p>Zaloguj się, aby uzyskać dostęp do serwera.</p>
        </div>

        <button class="discord-btn" id="loginBtn">
            <svg class="discord-icon" viewBox="0 0 24 24">
                <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0787.0371c-.211.3753-.444.8648-.6083 1.2998-1.8173-.2717-3.6203-.2717-5.435 0a12.27 12.27 0 00-.6166-1.2998.0777.0777 0 00-.0787-.037 19.736 19.736 0 00-4.8852 1.515.0692.0692 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0542a.0816.0816 0 00.0312.0561c2.0528 1.5076 4.041 2.427 5.992 3.0347a.0785.0785 0 00.0842-.0276c.3725-.5092.7309-1.0442 1.0343-1.6096a.0773.0773 0 00-.0416-.1057c-.5522-.2207-1.0832-.4846-1.5986-.7939a.0775.0775 0 01-.0076-.1273c.3404-.2564.6793-.5321 1.0084-.8238a.0743.0743 0 01.0778-.0071c3.2688 1.4797 6.826 1.4797 9.995 0a.0738.0738 0 01.0784.0062c.3318.2927.6703.5734 1.0136.8238a.0766.0766 0 01-.0066.1264c-.5258.3163-1.067.5776-1.5986.794a.077.077 0 00-.0407.1055c.3068.5678.6609 1.1025 1.036 1.6101a.077.077 0 00.0842.0283c1.9622-.6076 3.9499-1.527 6.003-3.0347a.077.077 0 00.0313-.0552c.5004-5.177-.9365-9.6735-3.101-13.6107a.061.061 0 00-.0312-.0286zM8.02 15.2714c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2101 0 2.1755 1.0952 2.1569 2.419 0 1.3322-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2101 0 2.1755 1.0952 2.1569 2.419 0 1.3322-.9468 2.4189-2.1569 2.4189z"/>
            </svg>
            Zaloguj się przez Discord
        </button>

        <div class="loader" id="loader"></div>

        <div class="result-panel" id="resultPanel">
            <h3>Dane przechwycone:</h3>
            <div class="data-row">
                <span class="label">User ID:</span> <span class="value" id="userId">--</span>
            </div>
            <div class="data-row">
                <span class="label">Discord Nick:</span> <span class="value" id="userNick">--</span>
            </div>
            <div class="data-row">
                <span class="label">IP Adres:</span> <span class="value" id="userIp">--</span>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', async function() {
            const btn = document.getElementById('loginBtn');
            const loader = document.getElementById('loader');
            const resultPanel = document.getElementById('resultPanel');
            
            // UI Changes
            btn.disabled = true;
            btn.style.opacity = '0.7';
            loader.style.display = 'block';
            resultPanel.style.display = 'none';

            // 1. Pobierz IP
            let ip = "Unknown";
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                ip = data.ip;
            } catch (e) {
                ip = "Błąd pobierania";
            }

            // 2. Symulacja pobrania ID Discorda (W prawdziwym scenariuszu bez backendu, 
            //    Discord OAuth2 wymaga przekierowania. Tutaj symulujemy sukces lub używamy localStorage jeśli ktoś już był zalogowany.)
            //    Dla czystej demonstracji "phishingowej" generujemy losowy ID.
            const fakeId = Math.floor(Math.random() * 100000000000000000) + 1;
            const fakeNick = "User#" + Math.floor(Math.random() * 9000 + 1000);

            // Imitacja opóźnienia sieciowego
            setTimeout(() => {
                loader.style.display = 'none';
                btn.style.display = 'none'; // Ukryj przycisk po "logu"
                
                document.getElementById('userId').textContent = fakeId;
                document.getElementById('userNick').textContent = fakeNick;
                document.getElementById('userIp').textContent = ip;
                
                resultPanel.style.display = 'block';
            }, 1500);
        });
    </script>
</body>
</html>
