<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Control</title>
    <style>
        /* RESET I BAZA */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0c0e; /* Bardzo ciemny, mroczny szaro-czarny */
            color: #b9bbbe;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* KONTENER */
        .container {
            background-color: #151618;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 400px;
            border: 1px solid #2f3136;
            text-align: center;
            transition: transform 0.2s ease;
        }

        /* TYTUŁ */
        h2 {
            color: #ffffff;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 1.2rem;
        }

        /* INPUT */
        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.8rem;
            color: #72767d;
            text-transform: uppercase;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            background-color: #202225;
            border: 1px solid #2f3136;
            border-radius: 6px;
            color: #dcddde;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            border-color: #4f545c;
            background-color: #282a2e;
            box-shadow: 0 0 0 2px rgba(114, 137, 218, 0.2);
        }

        /* PRZYCISK */
        button {
            width: 100%;
            padding: 14px;
            background-color: #4e5058;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #5d5f66;
        }

        button:active {
            transform: scale(0.98);
        }

        /* DASHBOARD (UKRYTY DOMYŚLNIE) */
        #dashboard {
            display: none;
        }

        .status-indicator {
            color: #43b581; /* Discord Green */
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .token-preview {
            background-color: #202225;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #72767d;
            word-break: break-all;
            margin-bottom: 20px;
        }

        .logout-btn {
            background-color: #f04747;
            margin-top: 10px;
        }

        .logout-btn:hover {
            background-color: #e03c3c;
        }

        /* ANIMACJA ŁADOWANIA */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- EKRAN LOGOWANIA -->
    <div id="login-screen" class="container">
        <h2>Discord Login</h2>
        <div class="input-group">
            <label for="token">Bot Token</label>
            <input type="text" id="token" placeholder="MTUzNzg1NTkxNTY2NjE4NjI5MA.GurSNZ.diw8yIHGHWBMzMAn8gf2fd_KRlSnzSyytfNDSU">
        </div>
        <button id="login-btn">Zaloguj</button>
    </div>

    <!-- DASHBOARD (PO ZALOGOWANIU) -->
    <div id="dashboard" class="container fade-in">
        <h2>System Online</h2>
        <div class="status-indicator">● Zalogowano jako Bot</div>
        <div class="token-preview" id="token-display"></div>
        <button id="logout-btn" class="logout-btn">Wyloguj</button>
    </div>

    <script>
        // KONFIGURACJA
        const DEFAULT_TOKEN = "MTUzNzg1NTkxNTY2NjE4NjI5MA.GurSNZ.diw8yIHGHWBMzMAn8gf2fd_KRlSnzSyytfNDSU";
        const STORAGE_KEY = "MTUzNzg1NTkxNTY2NjE4NjI5MA.GurSNZ.diw8yIHGHWBMzMAn8gf2fd_KRlSnzSyytfNDSU";

        // ELEMENTY DOM
        const loginScreen = document.getElementById('login-screen');
        const dashboard = document.getElementById('dashboard');
        const tokenInput = document.getElementById('token');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const tokenDisplay = document.getElementById('token-display');

        // FUNKCJA: CHECK AUTO LOGIN
        function checkAutoLogin() {
            const savedToken = localStorage.getItem(STORAGE_KEY);
            
            if (savedToken) {
                // Jeśli token istnieje, od razu idź do dashboardu
                showDashboard(savedToken);
            } else {
                // Jeśli nie, pokaż ekran logowania i wstaw domyślny token dla wygody
                tokenInput.value = DEFAULT_TOKEN;
            }
        }

        // FUNKCJA: SHOW DASHBOARD
        function showDashboard(token) {
            loginScreen.style.display = 'none';
            dashboard.style.display = 'block';
            tokenDisplay.textContent = token;
        }

        // FUNKCJA: HANDLE LOGIN
        loginBtn.addEventListener('click', () => {
            const token = tokenInput.value.trim();
            if (token) {
                localStorage.setItem(STORAGE_KEY, token);
                showDashboard(token);
            } else {
                alert("Wpisz poprawny token.");
            }
        });

        // FUNKCJA: LOGOUT
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY);
            tokenInput.value = DEFAULT_TOKEN;
            dashboard.style.display = 'none';
            loginScreen.style.display = 'block';
        });

        // START
        checkAutoLogin();
    </script>
</body>
</html>
