<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nightwatch Access</title>
    <style>
        /* RESET & BASE */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0b;
            color: #b9bbbe;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* LOGIN OVERLAY */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        /* Klasa do animacji znikania */
        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.1); /* Lekkie powiększenie przy znikaniu dla efektu głębi */
        }

        .login-box {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 10px;
            border: 1px solid #333;
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .login-box h2 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #0b0b0b;
            border: 1px solid #333;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #5865F2;
        }

        .login-btn {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .login-btn:hover {
            background-color: #4752c4;
        }

        /* MAIN APP CONTAINER */
        #main-app {
            display: none; /* Domyślnie ukryte */
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }

        .visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* WELCOME SCREEN (POŚRÓD) */
        #welcome-message {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b0b;
            z-index: 900;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        #welcome-message h1 {
            font-size: 48px;
            color: #fff;
            text-shadow: 0 0 20px #5865F2;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 10px #5865F2; opacity: 0.8; }
            50% { text-shadow: 0 0 30px #5865F2; opacity: 1; }
            100% { text-shadow: 0 0 10px #5865F2; opacity: 0.8; }
        }

        /* DASHBOARD STYLES */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background: #5865F2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .info h3 {
            color: #fff;
            font-size: 18px;
        }

        .info p {
            font-size: 13px;
            color: #888;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .card h4 {
            color: #72767d;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .card .value {
            font-size: 24px;
            color: #fff;
        }

    </style>
</head>
<body>

    <!-- 1. EKRAN LOGOWANIA -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>Nightwatch</h2>
            <div class="input-group">
                <label for="nickname">Twoj nick</label>
                <input type="text" id="nickname" placeholder="np. Użytkownik#1234" autocomplete="off">
            </div>
            <button class="login-btn" id="enterBtn">WEJDŹ</button>
        </div>
    </div>

    <!-- 2. EKRAN POWITALNY (ANIMACJA) -->
    <div id="welcome-message">
        <h1 id="welcomeText">Witaj...</h1>
    </div>

    <!-- 3. GŁÓWNA APLIKACJA -->
    <div id="main-app">
        <div class="header">
            <div class="logo">
                <h2>👁️ NIGHTWATCH</h2>
            </div>
            <div class="user-profile">
                <div class="info">
                    <h3 id="displayNick">Użytkownik</h3>
                    <p>IP: <span id="displayIp">Loading...</span></p>
                </div>
                <div class="avatar" id="userAvatar">U</div>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h4>Status</h4>
                <div class="value" style="color: #23a559;">Online</div>
            </div>
            <div class="card">
                <h4>Discord ID</h4>
                <div class="value" id="displayId">Generating...</div>
            </div>
            <div class="card">
                <h4>Region</h4>
                <div class="value" id="displayRegion">Detecting...</div>
            </div>
        </div>
    </div>

    <script>
        // LOGIKA
        const overlay = document.getElementById('login-overlay');
        const welcomeMsg = document.getElementById('welcome-message');
        const welcomeText = document.getElementById('welcomeText');
        const mainApp = document.getElementById('main-app');
        const enterBtn = document.getElementById('enterBtn');
        const nickInput = document.getElementById('nickname');

        enterBtn.addEventListener('click', async () => {
            const nick = nickInput.value.trim();
            if (!nick) {
                nickInput.style.borderColor = '#f04747';
                nickInput.placeholder = "Wpisz swój nick!";
                return;
            }

            // 1. Pobierz IP
            let ip = "Unknown";
            let region = "Unknown";
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                ip = data.ip;
                region = data.country_name;
            } catch (e) {
                // Fallback
                try {
                    const res2 = await fetch('https://api.ipify.org?format=json');
                    const data2 = await res2.json();
                    ip = data2.ip;
                } catch (e2) { ip = "Error"; }
            }

            // 2. Pokaż ekran powitalny
            overlay.classList.add('hidden'); // Zniknie
            welcomeMsg.style.display = 'flex'; // Pojawi się
            welcomeText.textContent = `Witaj, ${nick}!`;

            // 3. Po animacji (1.5s) pokaż main app
            setTimeout(() => {
                welcomeMsg.style.display = 'none';
                mainApp.style.display = 'block';
                
                // Wypełnij dane
                document.getElementById('displayNick').textContent = nick;
                document.getElementById('userAvatar').textContent = nick.charAt(0).toUpperCase();
                document.getElementById('displayIp').textContent = ip;
                document.getElementById('displayRegion').textContent = region;
                
                // Losowe ID dla uroku
                const fakeId = Math.floor(Math.random() * 99999999999999999) + 1;
                document.getElementById('displayId').textContent = fakeId;

                // Włącz animację wejścia main app
                mainApp.classList.add('visible');

            }, 2000); // Czas na animację tekstu "Witaj"
        });

        // Enter na klawiaturze
        nickInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enterBtn.click();
        });
    </script>
</body>
</html>
